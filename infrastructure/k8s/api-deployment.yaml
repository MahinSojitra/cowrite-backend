apiVersion: apps/v1
kind: Deployment
metadata:
  name: cowrite-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cowrite-api
  template:
    metadata:
      labels:
        app: cowrite-api
    spec:
      containers:
        - name: api
          image: ghcr.io/mahinsojitra/cowrite-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: cowrite-secrets
          readinessProbe:
            httpGet:
              path: /api/health/liveness
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cowrite-api
spec:
  selector:
    app: cowrite-api
  ports:
    - port: 80
      targetPort: 3000
