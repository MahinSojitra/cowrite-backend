version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cowrite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cowrite
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - '3000:3000'

  collab:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.collab
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cowrite
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - '3001:3001'

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cowrite
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
